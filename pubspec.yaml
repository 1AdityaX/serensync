name: serensync
description: A minimalist Android launcher with built-in app blocking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  android_intent_plus: ^5.3.1
  apps_handler: ^2.0.0
  crypto: ^3.0.6
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^22.3.1
  flutter_overlay_window: ^0.5.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  tamper_guard: ^0.3.0
  usage_stats: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
