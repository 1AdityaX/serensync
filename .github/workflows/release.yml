name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 0.3.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "serensync-v$VERSION.apk"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s notes.md ]; then
            gh release create "v$VERSION" --title "v$VERSION" \
              --generate-notes "serensync-v$VERSION.apk"
          else
            gh release create "v$VERSION" --title "v$VERSION" \
              --notes-file notes.md "serensync-v$VERSION.apk"
          fi
